<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUNG THUY PHAM Luxury POS & Inventory System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone CDN (để biên dịch JSX ngay trong trình duyệt) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body class="bg-white text-neutral-900 selection:bg-neutral-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SVG ICONS COMPONENT REPLACEMENTS FOR LUCIDE ---
    const Icons = {
      Search: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      Plus: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash2: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
      Printer: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
      X: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      CheckSquare: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
      Square: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>,
      Edit: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      Save: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
      Menu: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
      Upload: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
      History: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/><line x1="12" y1="7" x2="12" y2="12"/><line x1="12" y1="12" x2="15" y2="15"/></svg>,
      RotateCcw: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>,
      Eye: (props) => <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    };

    function App() {
      // --- STATE MANAGEMENT WITH EMPTY INITIAL VALUES ---
      const [activeTab, setActiveTab] = useState('pos');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Initialize from LocalStorage
      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('luxury_bw_products_v3');
        return local ? JSON.parse(local) : [];
      });
      const [orders, setOrders] = useState(() => {
        const local = localStorage.getItem('luxury_bw_orders_v3');
        return local ? JSON.parse(local) : [];
      });
      const [stockIns, setStockIns] = useState(() => {
        const local = localStorage.getItem('luxury_bw_stock_in_v3');
        return local ? JSON.parse(local) : [];
      });
      const [shipments, setShipments] = useState(() => {
        const local = localStorage.getItem('luxury_bw_shipments_v3');
        return local ? JSON.parse(local) : [];
      });

      // LocalStorage Persistence
      useEffect(() => {
        localStorage.setItem('luxury_bw_products_v3', JSON.stringify(products));
      }, [products]);
      useEffect(() => {
        localStorage.setItem('luxury_bw_orders_v3', JSON.stringify(orders));
      }, [orders]);
      useEffect(() => {
        localStorage.setItem('luxury_bw_stock_in_v3', JSON.stringify(stockIns));
      }, [stockIns]);
      useEffect(() => {
        localStorage.setItem('luxury_bw_shipments_v3', JSON.stringify(shipments));
      }, [shipments]);

      // --- SELECTION & SHIFT-CLICK STATE FOR BARCODE PRINTING ---
      const [selectedProductIds, setSelectedProductIds] = useState([]);
      const [lastSelectedIndex, setLastSelectedIndex] = useState(null);
      const [labelQuantities, setLabelQuantities] = useState({});
      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);

      // --- PRODUCT FORM MODAL (ADD / EDIT) ---
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({
        name: '',
        category: 'Áo',
        price: '',
        costPrice: '',
        barcode: '',
        sizes: '',
        colors: '',
        stock: 0,
        image: ''
      });

      // --- POS STATE ---
      const [cart, setCart] = useState([]);
      const [searchPOS, setSearchPOS] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('Tất cả');
      const [discountPercent, setDiscountPercent] = useState(0);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [customerPaid, setCustomerPaid] = useState('');
      const [customerName, setCustomerName] = useState('Khách VIP');
      const [shouldPrintReceipt, setShouldPrintReceipt] = useState(true);
      const [invoiceModal, setInvoiceModal] = useState(null);

      // Quick Add Product state from POS
      const [isQuickAddModalOpen, setIsQuickAddModalOpen] = useState(false);
      const [quickProductForm, setQuickProductForm] = useState({
        name: '',
        category: '',
        price: '',
        sizes: '',
        colors: ''
      });

      // --- HISTORY & ORDER MODALS ---
      const [orderSearchQuery, setOrderSearchQuery] = useState('');
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);
      const [returningOrder, setReturningOrder] = useState(null);
      const [returnItemsQty, setReturnItemsQty] = useState({});

      // --- STOCK IN MODAL STATE ---
      const [isStockInModalOpen, setIsStockInModalOpen] = useState(false);
      const [stockInSupplier, setStockInSupplier] = useState('');
      const [stockInCart, setStockInCart] = useState([]);

      // --- AUDIT STATE ---
      const [auditData, setAuditData] = useState([]);
      useEffect(() => {
        setAuditData(products.map(p => ({ ...p, actualStock: p.stock })));
      }, [products]);

      // Currency Formatter
      const formatVND = (amount) => {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
      };

      // Helper to generate next sequential Barcode SP00001, SP00002...
      const generateNextBarcode = (currentProducts) => {
        const numbers = currentProducts
          .map(p => p.barcode)
          .filter(b => b && /^SP\d+$/i.test(b))
          .map(b => parseInt(b.replace(/^SP/i, ''), 10))
          .filter(n => !isNaN(n));
        
        const maxNumber = numbers.length > 0 ? Math.max(...numbers) : 0;
        const nextNumber = maxNumber + 1;
        return `SP${String(nextNumber).padStart(5, '0')}`;
      };

      // Compressed Image Handler
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            setProductForm(prev => ({ ...prev, image: dataUrl }));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      // --- QUICK ADD PRODUCT FROM POS ---
      const handleQuickAddProduct = (e) => {
        e.preventDefault();
        if (!quickProductForm.name || !quickProductForm.price) {
          alert('Vui lòng nhập tên sản phẩm và giá bán');
          return;
        }

        const nextBarcode = generateNextBarcode(products);
        const newProd = {
          id: `PRD-${Date.now().toString().slice(-6)}`,
          name: quickProductForm.name,
          category: quickProductForm.category,
          price: parseFloat(quickProductForm.price) || 0,
          costPrice: parseFloat(quickProductForm.price) * 0.6,
          barcode: nextBarcode,
          sizes: quickProductForm.sizes ? quickProductForm.sizes.split(',').map(s => s.trim()) : ['Freesize'],
          colors: quickProductForm.colors ? quickProductForm.colors.split(',').map(c => c.trim()) : ['Đen'],
          stock: 99,
          image: ''
        };

        setProducts(prev => [newProd, ...prev]);
        addToCart(newProd);

        setQuickProductForm({
          name: '',
          category: '',
          price: '',
          sizes: '',
          colors: ''
        });
        setIsQuickAddModalOpen(false);
      };

      // --- ADD / EDIT PRODUCT HANDLERS ---
      const openAddProductModal = () => {
        setEditingProduct(null);
        setProductForm({
          name: '',
          category: '',
          price: '',
          costPrice: '',
          barcode: generateNextBarcode(products),
          sizes: '',
          colors: '',
          stock: 0,
          image: ''
        });
        setIsProductModalOpen(true);
      };

      const openEditProductModal = (product) => {
        setEditingProduct(product);
        setProductForm({
          name: product.name,
          category: product.category,
          price: product.price,
          costPrice: product.costPrice || 0,
          barcode: product.barcode,
          sizes: Array.isArray(product.sizes) ? product.sizes.join(', ') : product.sizes,
          colors: Array.isArray(product.colors) ? product.colors.join(', ') : product.colors,
          stock: product.stock,
          image: product.image || ''
        });
        setIsProductModalOpen(true);
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.name || !productForm.price) {
          alert('Vui lòng điền tên sản phẩm và giá bán');
          return;
        }

        const formattedSizes = productForm.sizes ? productForm.sizes.split(',').map(s => s.trim()) : ['Freesize'];
        const formattedColors = productForm.colors ? productForm.colors.split(',').map(c => c.trim()) : ['Đen'];

        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? {
            ...p,
            name: productForm.name,
            category: productForm.category,
            price: parseFloat(productForm.price) || 0,
            costPrice: parseFloat(productForm.costPrice) || 0,
            barcode: productForm.barcode || p.barcode,
            sizes: formattedSizes,
            colors: formattedColors,
            stock: parseInt(productForm.stock) || 0,
            image: productForm.image
          } : p));
        } else {
          const newProd = {
            id: `PRD-${Date.now().toString().slice(-6)}`,
            name: productForm.name,
            category: productForm.category,
            price: parseFloat(productForm.price) || 0,
            costPrice: parseFloat(productForm.costPrice) || 0,
            barcode: productForm.barcode || generateNextBarcode(products),
            sizes: formattedSizes,
            colors: formattedColors,
            stock: parseInt(productForm.stock) || 0,
            image: productForm.image
          };
          setProducts([newProd, ...products]);
        }

        setIsProductModalOpen(false);
      };

      const handleDeleteProduct = (id) => {
        if (window.confirm('Bạn có chắc muốn xóa sản phẩm này?')) {
          setProducts(products.filter(p => p.id !== id));
          setSelectedProductIds(selectedProductIds.filter(pid => pid !== id));
        }
      };

      // --- SHIFT-CLICK SELECTION LOGIC ---
      const handleProductSelect = (id, index, event) => {
        if (event.shiftKey && lastSelectedIndex !== null) {
          const start = Math.min(lastSelectedIndex, index);
          const end = Math.max(lastSelectedIndex, index);
          const rangeIds = filteredProducts.slice(start, end + 1).map(p => p.id);
          
          const newSelected = Array.from(new Set([...selectedProductIds, ...rangeIds]));
          setSelectedProductIds(newSelected);
        } else {
          if (selectedProductIds.includes(id)) {
            setSelectedProductIds(selectedProductIds.filter(item => item !== id));
          } else {
            setSelectedProductIds([...selectedProductIds, id]);
          }
          setLastSelectedIndex(index);
        }
      };

      const handleSelectAll = () => {
        if (selectedProductIds.length === filteredProducts.length) {
          setSelectedProductIds([]);
        } else {
          setSelectedProductIds(filteredProducts.map(p => p.id));
        }
      };

      const handleOpenPrintModal = () => {
        if (selectedProductIds.length === 0) {
          alert('Vui lòng chọn ít nhất 1 sản phẩm để in tem mã.');
          return;
        }
        const initialQty = {};
        selectedProductIds.forEach(id => {
          initialQty[id] = 2;
        });
        setLabelQuantities(initialQty);
        setIsPrintModalOpen(true);
      };

      // --- POS CART OPERATIONS ---
      const addToCart = (product) => {
        const existingIndex = cart.findIndex(item => item.id === product.id);
        if (existingIndex > -1) {
          const updatedCart = [...cart];
          updatedCart[existingIndex].qty += 1;
          setCart(updatedCart);
        } else {
          setCart([...cart, {
            ...product,
            qty: 1,
            selectedSize: product.sizes[0] || 'Freesize',
            selectedColor: product.colors[0] || 'Đen'
          }]);
        }
      };

      const updateCartQty = (index, delta) => {
        const updatedCart = [...cart];
        updatedCart[index].qty = Math.max(1, updatedCart[index].qty + delta);
        setCart(updatedCart);
      };

      const removeFromCart = (index) => {
        setCart(cart.filter((_, i) => i !== index));
      };

      // POS Calculations
      const cartSubtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      const afterDirectDiscount = Math.max(0, cartSubtotal - (parseFloat(discountAmount) || 0));
      const percentDiscountValue = (afterDirectDiscount * (parseFloat(discountPercent) || 0)) / 100;
      const cartTotal = Math.max(0, afterDirectDiscount - percentDiscountValue);

      const paidVal = parseFloat(customerPaid) || 0;
      const changeAmount = paidVal > cartTotal ? paidVal - cartTotal : 0;

      const handleCheckout = () => {
        if (cart.length === 0) return;

        const updatedProducts = products.map(prod => {
          const cartItem = cart.find(c => c.id === prod.id);
          if (cartItem) {
            return { ...prod, stock: Math.max(0, prod.stock - cartItem.qty) };
          }
          return prod;
        });
        setProducts(updatedProducts);

        const newOrder = {
          id: `HD${Math.floor(10000 + Math.random() * 90000)}`,
          date: new Date().toISOString().replace('T', ' ').substring(0, 16),
          customer: customerName,
          items: cart.map(c => ({ id: c.id, name: c.name, qty: c.qty, price: c.price, size: c.selectedSize, color: c.selectedColor, barcode: c.barcode })),
          subtotal: cartSubtotal,
          directDiscount: parseFloat(discountAmount) || 0,
          discountPercent: parseFloat(discountPercent) || 0,
          finalTotal: cartTotal,
          paidAmount: paidVal > 0 ? paidVal : cartTotal,
          changeAmount: changeAmount,
          status: 'Hoàn thành'
        };

        setOrders([newOrder, ...orders]);

        setShipments(prev => [
          {
            id: `SHP-${Math.floor(1000 + Math.random() * 9000)}`,
            orderId: newOrder.id,
            recipient: customerName,
            address: 'Nhận tại Cửa Hàng VIP',
            status: 'Chờ giao hàng'
          },
          ...prev
        ]);

        if (shouldPrintReceipt) {
          setInvoiceModal(newOrder);
        } else {
          alert(`Đã hoàn tất thanh toán cho đơn hàng #${newOrder.id}`);
        }

        setCart([]);
        setDiscountAmount(0);
        setDiscountPercent(0);
        setCustomerPaid('');
      };

      // --- ORDER HISTORY ACTIONS ---
      const handleEditOrderInPOS = (order) => {
        if (cart.length > 0) {
          if (!window.confirm('Giỏ hàng POS hiện tại đang có sản phẩm. Bạn có muốn ghi đè bằng đơn hàng này không?')) {
            return;
          }
        }

        const restoredProducts = products.map(p => {
          const orderItem = order.items.find(it => it.id === p.id || it.barcode === p.barcode);
          if (orderItem) {
            return { ...p, stock: p.stock + orderItem.qty };
          }
          return p;
        });
        setProducts(restoredProducts);

        const reloadedCart = order.items.map(it => ({
          id: it.id || `PRD-${Math.random()}`,
          name: it.name,
          barcode: it.barcode || 'SP00000',
          price: it.price,
          qty: it.qty,
          selectedSize: it.size || 'S',
          selectedColor: it.color || 'Đen'
        }));

        setCart(reloadedCart);
        setCustomerName(order.customer);
        setDiscountAmount(order.directDiscount || 0);
        setDiscountPercent(order.discountPercent || 0);

        setOrders(orders.filter(o => o.id !== order.id));
        setSelectedOrderDetails(null);
        setActiveTab('pos');
      };

      const handleRefundOrder = (order) => {
        setReturningOrder(order);
        const initialQtys = {};
        order.items.forEach((item, i) => {
          initialQtys[i] = item.qty;
        });
        setReturnItemsQty(initialQtys);
      };

      const processReturnOrder = () => {
        if (!returningOrder) return;

        const updatedProducts = [...products];
        returningOrder.items.forEach((item, index) => {
          const returnQty = parseInt(returnItemsQty[index]) || 0;
          if (returnQty > 0) {
            const pIdx = updatedProducts.findIndex(p => p.id === item.id || p.barcode === item.barcode);
            if (pIdx > -1) {
              updatedProducts[pIdx].stock += returnQty;
            }
          }
        });
        setProducts(updatedProducts);

        setOrders(orders.map(o => {
          if (o.id === returningOrder.id) {
            return {
              ...o,
              status: 'Đã hoàn hàng',
              returnedAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
            };
          }
          return o;
        }));

        setReturningOrder(null);
        setSelectedOrderDetails(null);
        alert('Đã xử lý hoàn đơn và tự động cộng lại tồn kho thành công!');
      };

      const handleDeleteOrder = (orderId) => {
        if (window.confirm(`Xác nhận xóa hẳn đơn hàng #${orderId}? Thao tác này không thể hoàn tác.`)) {
          setOrders(orders.filter(o => o.id !== orderId));
          setSelectedOrderDetails(null);
        }
      };

      // --- STOCK IN HANDLER ---
      const handleCompleteStockIn = () => {
        if (stockInCart.length === 0) return;

        const updatedProducts = products.map(p => {
          const added = stockInCart.find(item => item.id === p.id);
          if (added) {
            return { ...p, stock: p.stock + added.qty };
          }
          return p;
        });

        setProducts(updatedProducts);
        setStockIns([
          {
            id: `NK-${Math.floor(1000 + Math.random() * 9000)}`,
            date: new Date().toISOString().split('T')[0],
            supplier: stockInSupplier || 'Nhà Cung Cấp Mặc Định',
            totalItems: stockInCart.reduce((a, b) => a + b.qty, 0),
            status: 'Đã hoàn thành'
          },
          ...stockIns
        ]);

        setStockInCart([]);
        setStockInSupplier('');
        setIsStockInModalOpen(false);
      };

      const handleApplyAudit = () => {

                    <p className="text-xs text-neutral-500">Khổ chuẩn: 72mm x 22mm - Thiết kế 2 tem / 1 hàng (Dual Tag / Row)</p>
                  </div>
                  <button onClick={() => setIsPrintModalOpen(false)} className="text-neutral-400 hover:text-neutral-900">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="max-h-32 overflow-y-auto border border-neutral-200 p-2 text-xs space-y-1">
                  <p className="font-semibold text-neutral-700 mb-1">Chỉnh số lượng tem in mỗi mẫu:</p>
                  {selectedProductsForPrint.map(p => (
                    <div key={p.id} className="flex justify-between items-center py-1 border-b border-neutral-100">
                      <span>{p.name} ({p.barcode})</span>
                      <div className="flex items-center space-x-1">
                        <input 
                          type="number"
                          min="1"
                          value={labelQuantities[p.id] || 1}
                          onChange={(e) => setLabelQuantities({...labelQuantities, [p.id]: parseInt(e.target.value) || 1})}
                          className="w-14 border border-neutral-300 p-0.5 text-center font-mono"
                        />
                        <span className="text-[10px] text-neutral-400">tem</span>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex-1 overflow-y-auto p-4 bg-neutral-100 border border-neutral-200">
                  <div id="print-area" className="bg-white p-4 max-w-[210mm] mx-auto space-y-2">
                    {(() => {
                      const expandedTags = [];
                      selectedProductsForPrint.forEach(prod => {
                        const qty = parseInt(labelQuantities[prod.id]) || 1;
                        for (let i = 0; i < qty; i++) {
                          expandedTags.push(prod);
                        }
                      });

                      const rows = [];
                      for (let i = 0; i < expandedTags.length; i += 2) {
                        rows.push(expandedTags.slice(i, i + 2));
                      }

                      return rows.map((row, rIdx) => (
                        <div 
                          key={rIdx} 
                          className="flex justify-center space-x-2 my-1" 
                          style={{ height: '22mm' }}
                        >
                          {row.map((item, cIdx) => (
                            <div 
                              key={cIdx} 
                              className="border border-neutral-800 p-1 flex flex-col justify-between overflow-hidden bg-white text-black"
                              style={{ width: '72mm', height: '22mm', boxSizing: 'border-box' }}
                            >
                              <div className="flex justify-between items-start text-[8px] font-bold uppercase tracking-wider border-b border-neutral-300 pb-0.5">
                                <span className="truncate font-serif">DUNG THUY PHAM HAUTE</span>
                                <span className="font-mono text-neutral-700">{formatVND(item.price)}</span>
                              </div>

                              <div className="my-0.5">
                                <p className="text-[9px] font-bold leading-tight uppercase truncate">{item.name}</p>
                                <p className="text-[7px] text-neutral-600 truncate">
                                  Size: {Array.isArray(item.sizes) ? item.sizes[0] : item.sizes} | Màu: {Array.isArray(item.colors) ? item.colors[0] : item.colors}
                                </p>
                              </div>

                              <div className="flex flex-col items-center">
                                <div className="w-full h-3 bg-neutral-900 flex justify-between px-1 items-center">
                                  <div className="w-full h-full bg-repeat-x" style={{
                                    backgroundImage: 'linear-gradient(90deg, #000 50%, #fff 50%)',
                                    backgroundSize: '3px 100%'
                                  }}></div>
                                </div>
                                <span className="text-[7px] font-mono tracking-widest text-neutral-800 mt-0.5">{item.barcode}</span>
                              </div>
                            </div>
                          ))}

                          {row.length === 1 && (
                            <div 
                              className="border border-dashed border-neutral-300 p-1 flex items-center justify-center"
                              style={{ width: '72mm', height: '22mm', boxSizing: 'border-box' }}
                            >
                              <span className="text-[8px] text-neutral-300 uppercase">Tem trống</span>
                            </div>
                          )}
                        </div>
                      ));
                    })()}
                  </div>
                </div>

                <div className="flex justify-between items-center border-t border-neutral-200 pt-4">
                  <span className="text-xs text-neutral-500 font-mono">Tổng tem: {totalLabelsToPrint}</span>
                  <div className="flex space-x-3">
                    <button 
                      onClick={() => setIsPrintModalOpen(false)}
                      className="px-4 py-2 text-xs uppercase tracking-wider border border-neutral-300 hover:bg-neutral-100"
                    >
                      Hủy
                    </button>
                    <button 
                      onClick={() => window.print()}
                      className="px-6 py-2 bg-neutral-900 text-white text-xs uppercase tracking-wider hover:bg-neutral-800 flex items-center space-x-2"
                    >
                      <Icons.Printer className="w-4 h-4" />
                      <span>Bắt Đầu In</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: LUXURY RECEIPT */}
          {invoiceModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-neutral-900 w-full max-w-sm p-6 space-y-4 text-neutral-900">
                <div className="text-center space-y-1">
                  <h2 className="font-serif text-xl tracking-[0.2em] font-bold uppercase">DUNG THUY PHAM HAUTE</h2>
                  <p className="text-[8px] tracking-[0.2em] text-neutral-400 uppercase">BOUTIQUE LUXURY</p>
                  <p className="text-[10px] text-neutral-500 font-mono mt-2">HÓA ĐƠN BÁN HÀNG #{invoiceModal.id}</p>
                </div>

                <div className="border-t border-b border-neutral-200 py-2 text-[11px] space-y-1">
                  <div className="flex justify-between text-neutral-500">
                    <span>Ngày:</span>
                    <span>{invoiceModal.date}</span>
                  </div>
                  <div className="flex justify-between text-neutral-500">
                    <span>Khách hàng:</span>
                    <span className="font-semibold text-neutral-900">{invoiceModal.customer}</span>
                  </div>
                </div>

                <div className="space-y-2 text-xs max-h-40 overflow-y-auto">
                  {invoiceModal.items.map((it, i) => (
                    <div key={i} className="flex justify-between">
                      <div>
                        <p className="font-semibold">{it.name}</p>
                        <p className="text-[10px] text-neutral-400">x{it.qty} - {formatVND(it.price)}</p>
                      </div>
                      <span className="font-mono">{formatVND(it.price * it.qty)}</span>
                    </div>
                  ))}
                </div>

                <div className="border-t border-neutral-200 pt-2 text-xs space-y-1">
                  <div className="flex justify-between text-neutral-500">
                    <span>Tạm tính</span>
                    <span>{formatVND(invoiceModal.subtotal)}</span>
                  </div>
                  {invoiceModal.directDiscount > 0 && (
                    <div className="flex justify-between text-neutral-500">
                      <span>Giảm giá</span>
                      <span>-{formatVND(invoiceModal.directDiscount)}</span>
                    </div>
                  )}
                  {invoiceModal.discountPercent > 0 && (
                    <div className="flex justify-between text-neutral-500">
                      <span>Chiết khấu</span>
                      <span>-{invoiceModal.discountPercent}%</span>
                    </div>
                  )}
                  <div className="flex justify-between text-sm font-bold border-t border-neutral-200 pt-1">
                    <span>Thành tiền</span>
                    <span>{formatVND(invoiceModal.finalTotal)}</span>
                  </div>
                  <div className="flex justify-between text-[11px] text-neutral-500 pt-1">
                    <span>Tiền khách đưa:</span>
                    <span>{formatVND(invoiceModal.paidAmount)}</span>
                  </div>
                  <div className="flex justify-between text-[11px] text-neutral-500">
                    <span>Trả lại khách:</span>
                    <span>{formatVND(invoiceModal.changeAmount)}</span>
                  </div>
                </div>

                <div className="pt-2 flex space-x-2">
                  <button 
                    onClick={() => setInvoiceModal(null)}
                    className="w-1/2 py-2.5 border border-neutral-300 text-xs uppercase tracking-wider hover:bg-neutral-100"
                  >
                    Đóng
                  </button>
                  <button 
                    onClick={() => window.print()}
                    className="w-1/2 py-2.5 bg-neutral-900 text-white text-xs uppercase tracking-wider hover:bg-neutral-800 flex items-center justify-center space-x-1"
                  >
                    <Icons.Printer className="w-3.5 h-3.5" />
                    <span>In Hóa Đơn</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: ORDER DETAILS VIEW */}
          {selectedOrderDetails && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-neutral-900 w-full max-w-md p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-neutral-200 pb-3">
                  <h3 className="font-serif text-sm tracking-widest uppercase font-bold text-neutral-900">
                    Chi Tiết Đơn Hàng #{selectedOrderDetails.id}
                  </h3>
                  <button onClick={() => setSelectedOrderDetails(null)} className="text-neutral-400 hover:text-neutral-900">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2 text-xs">
                  <p><span className="text-neutral-500">Ngày mua:</span> {selectedOrderDetails.date}</p>
                  <p><span className="text-neutral-500">Khách hàng:</span> {selectedOrderDetails.customer}</p>
                  <p><span className="text-neutral-500">Trạng thái:</span> <span className="font-bold uppercase">{selectedOrderDetails.status}</span></p>

                  <div className="border border-neutral-200 p-3 space-y-2 max-h-48 overflow-y-auto my-2">
                    {selectedOrderDetails.items.map((it, idx) => (
                      <div key={idx} className="flex justify-between items-center border-b border-neutral-100 pb-1">
                        <div>
                          <p className="font-semibold">{it.name}</p>
                          <p className="text-[10px] text-neutral-400">Mã: {it.barcode || 'N/A'} | SL: {it.qty}</p>
                        </div>
                        <span className="font-mono">{formatVND(it.price * it.qty)}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-1 pt-1 border-t border-neutral-200">
                    <div className="flex justify-between text-neutral-500">
                      <span>Tạm tính:</span>
                      <span>{formatVND(selectedOrderDetails.subtotal)}</span>
                    </div>
                    <div className="flex justify-between font-bold text-sm text-neutral-900 pt-1">
                      <span>Tổng tiền:</span>
                      <span>{formatVND(selectedOrderDetails.finalTotal)}</span>
                    </div>
                  </div>
                </div>

                <div className="pt-3 flex justify-between space-x-2">
                  <button 
                    onClick={() => setInvoiceModal(selectedOrderDetails)}
                    className="px-4 py-2 border border-neutral-900 text-neutral-900 text-xs uppercase flex items-center space-x-1 hover:bg-neutral-100"
                  >
                    <Icons.Printer className="w-3.5 h-3.5" />
                    <span>Xem Hóa Đơn</span>
                  </button>

                  <button 
                    onClick={() => setSelectedOrderDetails(null)}
                    className="px-4 py-2 bg-neutral-900 text-white text-xs uppercase hover:bg-neutral-800"
                  >
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: RETURN / REFUND ORDER */}
          {returningOrder && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-neutral-900 w-full max-w-md p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-neutral-200 pb-3">
                  <h3 className="font-serif text-sm tracking-widest uppercase font-bold text-neutral-900">
                    Hoàn Hàng / Nhập Trả Kho #{returningOrder.id}
                  </h3>
                  <button onClick={() => setReturningOrder(null)} className="text-neutral-400 hover:text-neutral-900">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <p className="text-neutral-600">Chọn số lượng sản phẩm khách hàng hoàn trả để đưa lại vào tồn kho:</p>
                  
                  <div className="space-y-2 border border-neutral-200 p-3 max-h-48 overflow-y-auto">
                    {returningOrder.items.map((it, idx) => (
                      <div key={idx} className="flex justify-between items-center py-1 border-b border-neutral-100">
                        <div>
                          <p className="font-semibold">{it.name}</p>
                          <p className="text-[10px] text-neutral-400">Đã mua: {it.qty} cái</p>
                        </div>
                        <div className="flex items-center space-x-1">
                          <span className="text-neutral-500">Trả:</span>
                          <input 
                            type="number" 
                            min="0"
                            max={it.qty}
                            value={returnItemsQty[idx] !== undefined ? returnItemsQty[idx] : it.qty}
                            onChange={(e) => setReturnItemsQty({ ...returnItemsQty, [idx]: parseInt(e.target.value) || 0 })}
                            className="w-14 border border-neutral-300 p-1 text-center font-mono text-xs"
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-2 flex space-x-2">
                  <button 
                    onClick={() => setReturningOrder(null)}
                    className="w-1/2 py-2.5 border border-neutral-300 text-xs uppercase hover:bg-neutral-100"
                  >
                    Hủy
                  </button>
                  <button 
                    onClick={processReturnOrder}
                    className="w-1/2 py-2.5 bg-neutral-900 text-white text-xs uppercase hover:bg-neutral-800"
                  >
                    Xác Nhận Hoàn
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: CREATE STOCK IN */}
          {isStockInModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-neutral-900 w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <h3 className="font-serif text-base tracking-wider uppercase font-bold">Tạo Phiếu Nhập Kho</h3>
                
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-neutral-500 mb-1">Nhà Cung Cấp</label>
                    <input 
                      type="text"
                      value={stockInSupplier}
                      onChange={(e) => setStockInSupplier(e.target.value)}
                      placeholder="Nhập tên nhà cung cấp..."
                      className="w-full border border-neutral-300 p-2 text-xs focus:outline-none focus:border-neutral-900"
                    />
                  </div>

                  <div>
                    <label className="block text-neutral-500 mb-1">Chọn Sản Phẩm Cần Nhập Kho</label>
                    {products.length === 0 ? (
                      <p className="text-neutral-400 italic">Vui lòng tạo sản phẩm trước khi nhập kho.</p>
                    ) : (
                      <div className="max-h-48 overflow-y-auto space-y-2 border border-neutral-200 p-2">
                        {products.map(p => {
                          const inCart = stockInCart.find(item => item.id === p.id);
                          return (
                            <div key={p.id} className="flex justify-between items-center py-1 border-b border-neutral-100">
                              <span className="truncate max-w-[180px] font-medium">{p.name}</span>
                              <div className="flex items-center space-x-2">
                                <input 
                                  type="number" 
                                  min="1"
                                  placeholder="Số lượng"
                                  value={inCart ? inCart.qty : ''}
                                  onChange={(e) => {
                                    const qty = parseInt(e.target.value) || 0;
                                    if (qty <= 0) {
                                      setStockInCart(stockInCart.filter(item => item.id !== p.id));
                                    } else {
                                      const existing = stockInCart.find(item => item.id === p.id);
                                      if (existing) {
                                        setStockInCart(stockInCart.map(item => item.id === p.id ? { ...item, qty } : item));
                                      } else {
                                        setStockInCart([...stockInCart, { ...p, qty }]);
                                      }
                                    }
                                  }}
                                  className="w-16 border border-neutral-300 p-1 text-center text-xs"
                                />
                                <span className="text-[10px] text-neutral-400">cái</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                <div className="pt-2 flex space-x-2">
                  <button 
                    onClick={() => setIsStockInModalOpen(false)} 
                    className="w-1/2 py-2 border border-neutral-300 text-xs uppercase"
                  >
                    Hủy
                  </button>
                  <button 
                    onClick={handleCompleteStockIn} 
                    disabled={stockInCart.length === 0}
                    className="w-1/2 py-2 bg-neutral-900 text-white text-xs uppercase hover:bg-neutral-800 disabled:opacity-50"
                  >
                    Xác Nhận Nhập
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
